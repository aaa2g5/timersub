<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>timerV5</title>
  <style>
    /* 追加されたソースのCSSスタイル [1] */
    html, body {
      height: 100%;
      margin: 0;
      font-family: sans-serif;
    }

    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 28px;
      box-sizing: border-box;
    }

    /* 上部：時刻 / 目標 / 連続記録の枠組み */
    .hud-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 16px;
    }

    /* ① 左上：時刻・天気 */
    .clock-box {
      line-height: 1.3;
      font-weight: bold;
    }

    .clock-time {
      font-size: 32px;
    }

    .clock-sub {
      font-size: 18px;
      margin-top: 4px;
    }

    /* ② 中央：目標カード枠 */
    .goal-card {
      width: 240px;
      border: 2px solid #212529;
      border-radius: 10px;
      background: #fff;
      padding: 10px 12px;
      box-sizing: border-box;
    }

    .goal-title {
      font-size: 15px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .goal-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .goal-item {
      border: 1px solid #212529;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      background: #F8F9FA;
    }

    /* ③ 右上：Duolingo風 連続記録枠 */
    .streak-card {
      justify-self: end;
      border: 3px solid #FF9600;
      border-radius: 16px;
      background: #fff;
      padding: 12px 16px;
      box-shadow: 0 0 0 3px rgba(255, 150, 0, 0.22);
    }

    .streak-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
      font-weight: bold;
    }

    .streak-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .streak-icon {
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .streak-circle {
      width: 14px;
      height: 14px;
      border: 2px solid #212529;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
    }

    /* 達成時の円スタイル（追加装飾） */
    .streak-circle.achieved {
      background: #FF9600;
      border-color: #FF9600;
    }

    .divider {
      width: 320px;
      height: 2px;
      background: #212529;
      margin: 12px auto 0;
    }

    /* 下部：タイマー本体 */
    .timer-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .mode-switch, .preset-switch {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .mode-btn, .preset-btn {
      font-size: 15px;
      font-weight: bold;
      padding: 8px 20px;
      border-radius: 999px;
      border: 2px solid #DEE2E6;
      background: #fff;
      color: #212529;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .mode-btn.active {
      border-color: #0095D9;
      background: #0095D9;
      color: #fff;
    }

    .preset-btn.demo {
      border-color: #0095D9;
      background: #fff;
      color: #0095D9;
    }

    .preset-btn.normal {
      border-color: #0095D9;
      background: #0095D9;
      color: #fff;
    }

    .preset-btn.active {
      box-shadow: 0 0 0 2px rgba(0, 149, 217, 0.25);
    }

    .setting-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 68px;
      font-size: 18px;
      padding: 8px 10px;
      border: 2px solid #CED4DA;
      border-radius: 12px;
      background: #fff;
      color: #212529;
      text-align: center;
    }

    .round-btn {
      font-size: 20px;
      font-weight: bold;
      padding: 12px 32px;
      border-radius: 999px;
      border: 2px solid #212529;
      background: #fff;
      color: #212529;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .round-btn:hover {
      opacity: 0.88;
    }

    .round-btn:active {
      transform: scale(0.97);
    }

    .round-btn.small {
      font-size: 16px;
      padding: 9px 22px;
    }

    .round-btn.primary {
      background: #0095D9;
      color: #fff;
      border-color: #0095D9;
    }

    .status-label {
      font-size: 16px;
      font-weight: bold;
      color: #0095D9;
    }

    #time {
      font-size: 84px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }

    .btns {
      display: flex;
      gap: 16px;
    }

    /* 作動中はフルスクリーン＆タイマーと停止ボタンのみ */
    body.running .hud-top,
    body.running .divider,
    body.running .top,
    body.running .status-label,
    body.running #resetBtn {
      display: none;
    }

    body.running #time {
      font-size: 132px;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <!-- 上部：時刻 / 目標 / 連続記録の枠組み -->
    <div class="hud-top">
      <!-- ① 左上：時刻・天気 -->
      <div class="clock-box">
        <div class="clock-time" id="clockTime">00:00</div>
        <div class="clock-sub" id="clockSub">--/-- (--)</div>
      </div>

      <!-- ② 目標枠 -->
      <div class="goal-card">
        <div class="goal-title">
          <span>平日の目標</span>
          <span>×</span>
        </div>
        <div class="goal-list">
          <div class="goal-item">数学やる</div>
          <div class="goal-item">英語やる</div>
          <div class="goal-item">漢字やる</div>
        </div>
      </div>

      <!-- ③ Duolingo風 連続記録枠 -->
      <div class="streak-card">
        <div class="streak-days" id="streakDays"></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 下部：タイマー本体 -->
    <div class="timer-area">
      <div class="top">
        <div class="mode-switch">
          <button id="focusTab" class="mode-btn active">集中</button>
          <button id="breakTab" class="mode-btn">休憩</button>
          <button id="soundBtn" class="mode-btn active">音: 中</button>
        </div>

        <div class="preset-switch">
          <button id="demoPresetBtn" class="preset-btn demo active">デモ：集中5秒 / 休憩2秒</button>
          <button id="normalPresetBtn" class="preset-btn normal">通常：集中25分 / 休憩5分</button>
        </div>

        <div class="setting-row">
          <span>集中</span>
          <input id="focusInput" type="number" min="1" max="180" value="5" />
          <span id="focusUnit">秒</span>
          <span>／ 休憩</span>
          <input id="breakInput" type="number" min="1" max="180" value="2" />
          <span id="breakUnit">秒</span>
          <button id="setBtn" class="round-btn small">セット</button>
        </div>
      </div>

      <div id="statusLabel" class="status-label">集中モード</div>
      <div id="time">00:05</div>

      <div class="btns">
        <button id="startBtn" class="round-btn primary">開始</button>
        <button id="stopBtn" class="round-btn primary" style="display:none;">停止</button>
        <button id="resetBtn" class="round-btn">リセット</button>
      </div>
    </div>
  </div>

  <script>
    // --- 連続記録（Duolingo風 UI描画ロジック） ---
    const dayNames = ['月', '火', '水', '木', '金', '土', '日'];

    function getFormattedDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // 今週（月〜日）の日付一覧を取得
    function getCurrentWeekDates() {
      const now = new Date();
      const dayIndex = (now.getDay() + 6) % 7; // 月曜日を0とする
      const monday = new Date(now);
      monday.setDate(now.getDate() - dayIndex);

      const weekDates = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        weekDates.push(getFormattedDate(d));
      }
      return weekDates;
    }

    // 連続記録枠（#streakDays）の描画
    function renderStreakUI() {
      const container = document.getElementById('streakDays');
      if (!container) return;

      const weekDates = getCurrentWeekDates();
      const completedDates = JSON.parse(localStorage.getItem('completedPomodoroDates') || '[]');

      container.innerHTML = weekDates.map((dateStr, index) => {
        const isAchieved = completedDates.includes(dateStr);
        return `
          <div class="streak-col" title="${dateStr}">
            <div class="streak-icon">${isAchieved ? '🔥' : ''}</div>
            <div class="streak-circle ${isAchieved ? 'achieved' : ''}"></div>
            <span>${dayNames[index]}</span>
          </div>
        `;
      }).join('');
    }

    // ポモドーロ達成時の記録処理
    function recordCompletion() {
      const today = getFormattedDate(new Date());
      let completedDates = JSON.parse(localStorage.getItem('completedPomodoroDates') || '[]');
      if (!completedDates.includes(today)) {
        completedDates.push(today);
        localStorage.setItem('completedPomodoroDates', JSON.stringify(completedDates));
      }
      renderStreakUI();
    }

    // --- タイマー機能の実装 ---
    let timerId = null;
    let isFocusMode = true;
    let secondsLeft = 5; // デモ設定（5秒）

    const timeDisplay = document.getElementById('time');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusLabel = document.getElementById('statusLabel');

    function updateTimeDisplay() {
      const m = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
      const s = String(secondsLeft % 60).padStart(2, '0');
      timeDisplay.textContent = `${m}:${s}`;
    }

    function startTimer() {
      if (timerId !== null) return;
      document.body.classList.add('running');
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';

      timerId = setInterval(() => {
        secondsLeft--;
        updateTimeDisplay();

        if (secondsLeft <= 0) {
          stopTimer();
          if (isFocusMode) {
            recordCompletion(); // 集中セッション完了で炎アイコン付与
            alert('集中セッション完了！お疲れ様でした。');
          } else {
            alert('休憩終了！');
          }
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      document.body.classList.remove('running');
      startBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
    }

    // --- 時刻・日付表示（左上 clock-box） ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockTime').textContent = `${hours}:${minutes}`;

      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayStr = ['日', '月', '火', '水', '木', '金', '土'][now.getDay()];
      document.getElementById('clockSub').textContent = `${month}/${date} (${dayStr})`;
    }

    // イベントリスナー
    startBtn.addEventListener('click', startTimer);
    stopBtn.addEventListener('click', stopTimer);
    resetBtn.addEventListener('click', () => {
      stopTimer();
      secondsLeft = parseInt(document.getElementById('focusInput').value, 10);
      updateTimeDisplay();
    });

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      updateClock();
      setInterval(updateClock, 10000);
      renderStreakUI();
      updateTimeDisplay();
    });
  </script>
</body>
</html>
